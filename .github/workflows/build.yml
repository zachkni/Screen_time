name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ScreenTime.xcodeproj \
            -scheme ScreenTime \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || { grep -E 'error:|warning: .*deprecated' build.log | sort -u; tail -n 40 build.log; exit 1; }
          grep -E 'warning:' build.log | sort -u | head -n 50 || true
