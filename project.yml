# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
#
# ── Change these two values before building on your phone ─────────────────────
#   APP_BUNDLE_ID   must be unique to you, e.g. com.yourname.screentime
#   DEVELOPMENT_TEAM your Apple team ID (Xcode ▸ Settings ▸ Accounts), or leave
#                    empty and pick your team in each target's "Signing" tab.
# ──────────────────────────────────────────────────────────────────────────────
name: ScreenTime

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    APP_BUNDLE_ID: com.yourname.screentime
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  ScreenTime:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Screen Time
        AppGroupID: group.$(APP_BUNDLE_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/ScreenTime.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
    dependencies:
      - target: ActivityMonitor
      - target: ShieldConfig
      - target: UsageReport
    scheme: {}

  # Runs in the background: applies blocks when limits are hit / downtime starts.
  ActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - ActivityMonitor
      - Shared/AppGroup.swift
      - Shared/Models.swift
      - Shared/Shield.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).monitor
    info:
      path: ActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: ActivityMonitor
        AppGroupID: group.$(APP_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: ActivityMonitor/ActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]

  # Draws the screen you see when you open a blocked app.
  ShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).shield
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: ShieldConfig
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfig/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true

  # Renders the "Today" usage report (Apple only exposes usage data here).
  UsageReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - UsageReport
      - Shared/ReportContext.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).report
    info:
      path: UsageReport/Info.plist
      properties:
        CFBundleDisplayName: UsageReport
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: UsageReport/UsageReport.entitlements
      properties:
        com.apple.developer.family-controls: true
